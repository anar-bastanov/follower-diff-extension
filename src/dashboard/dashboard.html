<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Follower Diff</title>
  <link rel="stylesheet" href="dashboard.css">
  <script src="../shared/accents.js"></script>
  <script src="../shared/theme.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-left">
      <div class="brand"><span id="logo"></span>Follower Diff</div>
      <nav class="top-nav">
        <button class="nav-item" id="nav-profiles" data-act="nav-profiles"></button>
        <button class="nav-item" id="nav-settings" data-act="nav-settings"></button>
      </nav>
    </div>
    <div class="top-actions">
      <button id="btn-export" class="btn ghost"></button>
      <button id="btn-import" class="btn ghost"></button>
      <input type="file" id="file-import" accept="application/json,.json" hidden>
    </div>
  </header>

  <main id="main" class="page"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="../shared/icons.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/diff.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
