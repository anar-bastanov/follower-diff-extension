name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches manifest.json
        run: |
          version="v$(jq -r .version manifest.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Check scripts
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build zip
        run: |
          mkdir dist
          zip -r "dist/follower-diff-$GITHUB_REF_NAME.zip" manifest.json src icons -x icons/icon.svg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Follower Diff $GITHUB_REF_NAME" --generate-notes
